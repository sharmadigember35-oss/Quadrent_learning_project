[project]
name = "quadrent-learning"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sharmadigember35-oss", email = "sharmadigember35@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "groq>=1.7.0",
    "pypdf>=6.21.4",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.20.0",
    "sentence-transformers>=6.2.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
quadrent-learning = "quadrent_learning:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "Practice",
]
